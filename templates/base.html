<!DOCTYPE html>
<html>
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>SafeStep</title>
        <!-- Bootstrap 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
        <style>
                html, body, #app-root { height: 100%; }
                .map-full { height: calc(100vh - 72px); }
                .sidebar { height: calc(100vh - 72px); overflow:auto; }
                .route-item { cursor: pointer; padding: 8px; border-bottom: 1px solid #eee; }
                .route-item:hover { background:#f8f9fa; }
        </style>
</head>
<body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">SafeStep</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="/report">Report Problem</a></li>
                        <li class="nav-item"><a class="nav-link" href="/routes">Route Planner</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div id="app-root" class="container-fluid">
                {% block content %}{% endblock %}
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
